buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.application'

android {

    namespace = "com.dpjudas.surrealengine"

    defaultConfig {
        applicationId "com.dpjudas.surrealengine"

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                targets "surrealengine"
            }
        }

        minSdkVersion 29
        targetSdkVersion 34
    }

    // Two side-by-side apps from one engine: same code, different bundled game, app name and
    // game data folder. "unrealgold" keeps the original applicationId and /sdcard/SurrealEngine
    // so existing installs and their saves keep working; "ut99" is a separate app.
    flavorDimensions = ["game"]
    productFlavors {
        unrealgold {
            dimension "game"
            resValue "string", "app_name", "Unreal Gold VR"
            resValue "string", "game_data_dir", "/sdcard/SurrealEngine"
            // No game data in the APK: offer to download the original disc image from
            // OldUnreal's servers (archive.org as fallback) - same sources, size and SHA-256 as
            // OldUnreal's own installer (github.com/OldUnreal/FullGameInstallers).
            resValue "string", "game_name", "Unreal Gold"
            resValue "string", "game_iso_name", "UNREAL_GOLD.ISO"
            resValue "string", "game_iso_urls", "https://files.oldunreal.net/UNREAL_GOLD.ISO|https://files2.oldunreal.net/UNREAL_GOLD.ISO|https://files3.oldunreal.net/UNREAL_GOLD.ISO|https://archive.org/download/totallyunreal/UNREAL_GOLD.ISO"
            resValue "string", "game_iso_size", "676734976"
            resValue "string", "game_iso_sha256", "7e360d0cc9e5533f38859819fd3cbfea7c475ecd428f9f433b5f8e1d5742cbca"
        }
        ut99 {
            dimension "game"
            applicationIdSuffix ".ut99"
            resValue "string", "app_name", "Unreal Tournament VR"
            resValue "string", "game_data_dir", "/sdcard/SurrealEngineUT"
            // Disc-image download not set up for UT yet (empty = sideload only).
            resValue "string", "game_name", "Unreal Tournament"
            resValue "string", "game_iso_name", ""
            resValue "string", "game_iso_urls", ""
            resValue "string", "game_iso_size", ""
            resValue "string", "game_iso_sha256", ""
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        def keystorePath = (project.hasProperty('key.store')) ?
                new File(project.getProperty('key.store')) :
                project.file('android.debug.keystore')

        def keystorePassword = (project.hasProperty('key.store.password')) ?
                project.getProperty('key.store.password') : 'android'

        def keystoreKeyAlias = (project.hasProperty('key.alias')) ?
                project.getProperty('key.alias') : 'androiddebugkey'

        def keystoreKeyPassword = (project.hasProperty('key.alias.password')) ?
                project.getProperty('key.alias.password') : 'android'

        debug {
            storeFile keystorePath
            storePassword keystorePassword
            keyAlias keystoreKeyAlias
            keyPassword keystoreKeyPassword
            v2SigningEnabled true
        }

        release {
            storeFile keystorePath
            storePassword keystorePassword
            keyAlias keystoreKeyAlias
            keyPassword keystoreKeyPassword
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            jniDebuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            // Bundled game data + SurrealEngine.pk3, staged here (git-ignored) from the user's
            // own game install; extracted to the game directory on first launch by
            // SurrealEngineActivity. See the release notes in Docs/ before distributing.
            assets.srcDirs = [] // bundled game data comes from the flavor source sets below
            jniLibs.srcDir "$buildDir/generated/openxr-loader/jniLibs"
            res.srcDirs = ['res']
        }
        unrealgold {
            assets.srcDirs = ['assets-game']
        }
        ut99 {
            assets.srcDirs = ['assets-game-ut']
        }
    }

    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    lintOptions {
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }

    // Store the bundled game files as-is: deflating 840MB of UE1 packages is what ran the
    // asset compressor out of heap, the packages barely compress anyway, and stored assets
    // extract far faster on first launch (SurrealEngineActivity).
    androidResources {
        noCompress 'u', 'unr', 'utx', 'uax', 'umx', 'ini', 'int', 'pk3', 'txt', 'dll', 'exe', 'est', 'frt', 'itt', 'det', 'ucl', 'log', 'bmp', 'png', 'wav', 'ogg', 'zip', 'gz'
    }

    compileSdk 34

    buildToolsVersion = '34.0.0'

    ndkVersion '27.2.12479018'
}

repositories {
    google()
    mavenCentral()
}

configurations {
    openxrLoaderAar
}

dependencies {
    implementation "androidx.core:core:1.12.0"
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.60"
    openxrLoaderAar "org.khronos.openxr:openxr_loader_for_android:1.1.60@aar"
}

// Gradle's cmake externalNativeBuild plugin needs the OpenXR loader .so
// available before the native build links against it, so extract it from
// the AAR (see libs/arm64-v8a/readme.txt for why we don't vendor it directly).
tasks.register("extractOpenXrLoader", Copy) {
    from({ zipTree(configurations.openxrLoaderAar.singleFile) }) {
        include "prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so"
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = "arm64-v8a/libopenxr_loader.so"
        }
        includeEmptyDirs = false
    }
    into "$buildDir/generated/openxr-loader/jniLibs"
}

tasks.named("preBuild").configure {
    dependsOn("extractOpenXrLoader")
}
